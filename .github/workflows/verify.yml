name: Verify secrets (no posting)
on:
  push: {paths: ["verify/request.txt"]}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 publish/verify.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IG_USER_ID_403: ${{ secrets.IG_USER_ID_403 }}
          IG_TOKEN_403: ${{ secrets.IG_TOKEN_403 }}
          YT_REFRESH_403: ${{ secrets.YT_REFRESH_403 }}
          IG_USER_ID_STOIC: ${{ secrets.IG_USER_ID_STOIC }}
          IG_TOKEN_STOIC: ${{ secrets.IG_TOKEN_STOIC }}
          YT_REFRESH_STOIC: ${{ secrets.YT_REFRESH_STOIC }}
          IG_USER_ID_KADHA: ${{ secrets.IG_USER_ID_KADHA }}
          IG_TOKEN_KADHA: ${{ secrets.IG_TOKEN_KADHA }}
          YT_REFRESH_KADHA: ${{ secrets.YT_REFRESH_KADHA }}
      - run: |
          git config user.name "verify-bot"; git config user.email "actions@users.noreply.github.com"
          git add verify/result.json && git commit -m "Secret check result" && git push || echo "no change"
