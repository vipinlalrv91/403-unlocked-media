<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;700;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:2560px;height:1440px;background:#050505;overflow:hidden}
.b{position:relative;width:2560px;height:1440px;background:
 radial-gradient(ellipse 60% 55% at 50% 50%,rgba(46,229,157,.10) 0%,transparent 70%),
 radial-gradient(ellipse at 50% 50%,#14120c 0%,#050505 70%)}
.grid{position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(217,169,58,.06) 1px,transparent 1px) 0 0/64px 64px,
 linear-gradient(0deg,rgba(217,169,58,.06) 1px,transparent 1px) 0 0/64px 64px;
 -webkit-mask:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 80%)}
#chart{position:absolute;left:0;top:0;width:2560px;height:1440px}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:34px}
.safe>svg{width:400px;height:400px;flex:none;margin-top:-10px}
h1{font-family:Cinzel,serif;font-weight:900;font-size:104px;letter-spacing:5px;margin:0;line-height:1.05;white-space:nowrap;color:#F4F4F4;
 text-shadow:0 0 30px rgba(217,169,58,.35)}
h1 span{background:linear-gradient(180deg,#F7DE8F,#D9A93A 55%,#A9781C);-webkit-background-clip:text;color:transparent}
.t{font-family:Inter,sans-serif;font-weight:800;font-size:40px;color:#2EE59D;margin-top:22px;letter-spacing:3px;white-space:nowrap;text-shadow:0 0 18px rgba(46,229,157,.45)}
.s{font-family:Inter,sans-serif;font-weight:500;font-size:31px;color:#cfc6ae;margin-top:14px;letter-spacing:4px;white-space:nowrap}
.pill{display:inline-block;margin-top:22px;padding:10px 26px;border:2px solid #D9A93A;border-radius:40px;font-family:Inter,sans-serif;font-weight:700;font-size:28px;color:#F7DE8F;letter-spacing:3px}
</style></head><body><div class="b"><div class="grid"></div>
<svg id="chart" viewBox="0 0 2560 1440"></svg>
<div class="safe"><svg viewBox="0 0 800 800"> <defs>
  <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DE8F"/><stop offset=".5" stop-color="#D9A93A"/><stop offset="1" stop-color="#A9781C"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <!-- green candles between horns -->
 <g filter="url(#glow)" fill="#2EE59D" stroke="#2EE59D" stroke-linecap="round">
  <line x1="340" y1="250" x2="340" y2="345" stroke-width="6"/><rect x="326" y="270" width="28" height="62" rx="3"/>
  <line x1="400" y1="150" x2="400" y2="330" stroke-width="6"/><rect x="386" y="185" width="28" height="120" rx="3"/>
  <line x1="460" y1="205" x2="460" y2="335" stroke-width="6"/><rect x="446" y="228" width="28" height="86" rx="3"/>
  <path d="M378 132 L400 98 L422 132 Z" stroke-width="4" stroke-linejoin="round"/>
 </g>
 <g fill="none" stroke="url(#g2)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" filter="url(#gglow)">
  <!-- horns -->
  <path d="M312 352 C 228 352 168 300 176 196 C 206 262 254 300 322 316"/>
  <path d="M488 352 C 572 352 632 300 624 196 C 594 262 546 300 478 316"/>
  <!-- ears -->
  <path d="M300 372 L 222 392 L 292 426"/>
  <path d="M500 372 L 578 392 L 508 426"/>
  <!-- head -->
  <path d="M312 352 L 488 352 L 512 404 L 470 560 L 446 640 L 354 640 L 330 560 L 288 404 Z" fill="#050505"/>
  <!-- face lines -->
  <path d="M400 360 L 400 520" stroke-width="7"/>
  <path d="M330 440 L 372 456" stroke-width="10"/>
  <path d="M470 440 L 428 456" stroke-width="10"/>
  <path d="M352 580 Q 400 612 448 580" stroke-width="9"/>
  <circle cx="378" cy="598" r="9" stroke-width="7"/><circle cx="422" cy="598" r="9" stroke-width="7"/>
 </g></svg>
<div><h1>THE <span>STOIC</span> BULL</h1>
<div class="t">STOCK MARKET · ZERO TO HERO</div>
<div class="s">MALAYALAM · CALM MIND · SMART INVESTING</div>
<div class="pill">▶ NEW EPISODE DAILY</div></div></div></div>
<script>
const s=document.getElementById('chart');let h='';
h+='<defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
 '<linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DE8F"/><stop offset="1" stop-color="#A9781C"/></linearGradient>'+
 '<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(46,229,157,.22)"/><stop offset="1" stop-color="rgba(46,229,157,0)"/></linearGradient></defs>';
// candles: left side and right side (outside the text area), rising overall
function candles(x0,x1,yStart,yEnd,seed,op){let n=Math.floor((x1-x0)/46),p=yStart,pts=[];
 for(let i=0;i<n;i++){const t=i/(n-1),target=yStart+(yEnd-yStart)*t;const o=p;const c=target+Math.sin(i*seed)*38;
  const g=c<o,x=x0+i*46,hi=Math.min(o,c)-18-Math.abs(Math.sin(i*2.3))*20,lo=Math.max(o,c)+18+Math.abs(Math.cos(i*1.9))*20,col=g?'#2EE59D':'#FF4D5E';
  h+='<g opacity="'+op+'" filter="url(#gl)"><line x1="'+(x+12)+'" x2="'+(x+12)+'" y1="'+hi+'" y2="'+lo+'" stroke="'+col+'" stroke-width="4"/>'+
     '<rect x="'+x+'" y="'+Math.min(o,c)+'" width="24" height="'+Math.max(6,Math.abs(c-o))+'" rx="3" fill="'+col+'"/></g>';
  pts.push([x+12,c]);p=c;}return pts;}
const L=candles(60,560,1180,560,1.7,.55), R=candles(2010,2510,980,260,2.1,.55);
// gold trend line across bottom with area
let d='M0 1260 C 500 1220 800 1180 1200 1120 S 2000 980 2560 760';
h+='<path d="'+d+' L2560 1440 L0 1440 Z" fill="url(#area)"/>';
h+='<path d="'+d+'" fill="none" stroke="url(#cg)" stroke-width="6" filter="url(#gl)" opacity=".9"/>';
// rupee coins
function coin(x,y,r,o){h+='<g opacity="'+o+'" filter="url(#gl)"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#cg)"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.8)+'" fill="none" stroke="#7a5512" stroke-width="'+(r*.07)+'"/>'+
 '<text x="'+x+'" y="'+(y+r*.36)+'" text-anchor="middle" font-family="Inter" font-weight="800" font-size="'+(r*1.05)+'" fill="#6b4a0e">₹</text></g>';}
coin(300,300,70,.9);coin(420,190,44,.7);coin(180,470,36,.55);coin(2260,1180,78,.9);coin(2400,1060,46,.7);coin(2120,1290,38,.55);coin(1280,180,30,.35);coin(1500,1300,34,.4);
// rupee notes stack
function note(x,y,rot,o){h+='<g opacity="'+o+'" transform="rotate('+rot+' '+x+' '+y+')" filter="url(#gl)"><rect x="'+(x-90)+'" y="'+(y-44)+'" width="180" height="88" rx="8" fill="#1f7a55" stroke="#2EE59D" stroke-width="3"/>'+
 '<circle cx="'+x+'" cy="'+y+'" r="26" fill="none" stroke="#9ff5cf" stroke-width="3"/><text x="'+x+'" y="'+(y+12)+'" text-anchor="middle" font-family="Inter" font-weight="800" font-size="34" fill="#c9ffe6">₹</text></g>';}
note(2330,330,-14,.75);note(2210,430,10,.6);note(240,1060,12,.7);note(380,1180,-8,.55);
// sparkles
for(let i=0;i<70;i++){const x=(i*397)%2560,y=(i*733)%1440,r=1+(i%3);h+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#F7DE8F" opacity="'+(0.15+(i%5)*0.08)+'"/>';}
s.innerHTML=h;
</script></body></html>
